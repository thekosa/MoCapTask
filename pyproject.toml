[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mocap-qc"
version = "0.1.0"
description = "Read-only marker and UsdSkel quality reports"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
mocap-qc = "mocap_qc.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["mocap_qc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".analysis/pytest-cache"
